server.port=${PORT:8080}
spring.application.name=Task_Management_System
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:task_mgt_db}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT signing secret (min 32 characters). Never commit a real value; set JWT_SECRET instead.
# If unset, a random key is generated at startup (dev only: tokens reset on every restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Seeds a sample workspace and shows "Try the live demo" on the login page. Set DEMO_ENABLED=false to turn off.
app.demo.enabled=${DEMO_ENABLED:true}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
